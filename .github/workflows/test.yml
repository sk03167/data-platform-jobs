name: Test Data Jobs

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build deployment artifacts
        run: python -m build

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glue-artifacts
          path: |
            dist/*.whl
            glue/glue_job.py
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials for artifact publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::930628638871:role/lead-de-dev-jobs-artifact-publisher
          aws-region: us-east-1
          allowed-account-ids: "930628638871"
          role-session-name: glue-artifact-publish-${{ github.run_id }}

      - name: Publish immutable Glue artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          ARTIFACT_BUCKET: lead-de-dev-artifacts
        run: |
          set -euo pipefail

          artifact_prefix="s3://${ARTIFACT_BUCKET}/glue-artifacts/${GITHUB_SHA}"

          if aws s3 ls "${artifact_prefix}/" | grep -q .; then
            echo "Artifact path already exists: ${artifact_prefix}"
            exit 1
          fi

          aws s3 cp dist/*.whl "${artifact_prefix}/"
          aws s3 cp glue/glue_job.py "${artifact_prefix}/glue_job.py"
          aws s3 ls "${artifact_prefix}/"
