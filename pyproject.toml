[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brewery-pipeline"
version = "0.1.0"
description = "Open Brewery batch data pipeline"
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.3",
]

[project.optional-dependencies]
dev = [
  "delta-spark==3.3.2",
  "pyspark==3.5.7",
  "pytest==8.3.5",
  "ruff==0.11.0",
  "build==1.2.2.post1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
